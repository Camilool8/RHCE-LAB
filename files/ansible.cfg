# Sample ansible.cfg for reference (RHCE-LAB).
# Task 1 asks you to create your own at /home/student/ansible/ansible.cfg.
[defaults]
inventory          = ./inventory
roles_path         = ./roles:/usr/share/ansible/roles
# /usr/share/ansible/collections is where the rhel-system-roles RPM (2.x+)
# installs the bundled `redhat.rhel_system_roles` collection that the role
# tasks now call internally via FQCN. Without it on the search path,
# `ansible-playbook` against tasks 4 / 18 fails with
# `No module named 'ansible_collections.redhat'`.
collections_path   = ./mycollection:/usr/share/ansible/collections:~/.ansible/collections
remote_user        = student
host_key_checking  = False
private_key_file   = ~/.ssh/RH294-LAB
# Pretty YAML task output. The legacy `stdout_callback = yaml` (and its
# `community.general.yaml` redirect) was removed in community.general 12.0.0;
# the supported replacement is the built-in default callback with
# `result_format = yaml`.
stdout_callback    = ansible.builtin.default
result_format      = yaml

[privilege_escalation]
become             = True
become_method      = sudo
become_user        = root
become_ask_pass    = False

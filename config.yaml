# RHCE-LAB Configuration — edit values here, then `vagrant up`.

network:
  subnet: "192.168.56"          # private lab network (third octet free to change)
  netmask: "255.255.255.0"

vms:
  repo_server:
    hostname: "repo-server"
    ip: "192.168.56.40"
    memory: 2048              # reposync of BaseOS+AppStream wants headroom
    cpus: 2
    extra_disks:
      - size: 40              # /var/www/html/repo mirror. Some box variants
                              # (e.g. AlmaLinux 9 vmware_desktop arm64) ship
                              # ~20 GB root disks — too small for the ~28 GB
                              # BaseOS+AppStream mirror plus headroom.
  control:
    hostname: "ansible-control"
    ip: "192.168.56.50"
    memory: 2048
    cpus: 2
  nodes:
    count: 5                    # number of managed nodes (node1..nodeN)
    base_ip: 51                 # node1 = subnet.51, node2 = subnet.52, ...
    memory: 1280
    cpus: 1
    extra_disks:
      - size: 2                 # raw disk for task 17 (1200 MiB fits)
      - size: 1                 # extra disk for VG 'research' (task 16)
                                # — sized so 1200 MiB *doesn't* fit, forcing the
                                #   rescue path that falls back to 800 MiB

box:
  name: "almalinux/9"

lab:
  ansible_user: "student"
  ssh_key_name: "RH294-LAB"
  time_server: "172.25.254.250"

providers:
  # Auto-detection picks one from (host_os, host_arch). Override here
  # (e.g. "vmware_desktop") or with LAB_PROVIDER env var to pin a provider.
  default: ""

  virtualbox:     { enabled: true }
  libvirt:        { enabled: true, network_name: "rhce-lab" }
  parallels:      { enabled: true }
  vmware_desktop: { enabled: true }

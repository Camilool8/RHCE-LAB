# RHCE-LAB Configuration — edit values here, then `vagrant up`.

network:
  subnet: "192.168.56"          # private lab network (third octet free to change)
  netmask: "255.255.255.0"

vms:
  repo_server:
    hostname: "repo-server"
    ip: "192.168.56.40"
    memory: 1024
    cpus: 2
  control:
    hostname: "ansible-control"
    ip: "192.168.56.50"
    memory: 2048
    cpus: 2
  nodes:
    count: 5                    # number of managed nodes (node1..nodeN)
    base_ip: 51                 # node1 = subnet.51, node2 = subnet.52, ...
    memory: 1280
    cpus: 1
    extra_disks:
      - size: 2                 # /dev/sdb — raw, used by task 17
      - size: 2                 # /dev/sdc — built into VG 'research', task 16

box:
  name: "almalinux/9"

lab:
  ansible_user: "student"
  ssh_key_name: "RH294-LAB"
  time_server: "172.25.254.250"

providers:
  # Auto-detection picks one from (host_os, host_arch). Override here
  # (e.g. "vmware_desktop") or with LAB_PROVIDER env var to pin a provider.
  default: ""

  virtualbox:     { enabled: true }
  libvirt:        { enabled: true, network_name: "rhce-lab" }
  parallels:      { enabled: true }
  vmware_desktop: { enabled: true }
